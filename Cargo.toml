[workspace]
resolver = "2"
members = [
    "crates/tango",
    "crates/tango-webhooks",
]
exclude = ["examples"]

[workspace.package]
version       = "0.1.0"
edition       = "2021"
rust-version  = "1.80"
license       = "MIT"
repository    = "https://github.com/makegov/tango-rust"
homepage      = "https://docs.makegov.com"
authors       = ["MakeGov <hello@makegov.com>"]
readme        = "README.md"

[workspace.dependencies]
reqwest      = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio        = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
thiserror    = "1"
bon          = "3"
futures      = "0.3"
url          = "2"
http         = "1"
hmac         = "0.12"
sha2         = "0.10"
subtle       = "2"
hex          = "0.4"
# Dev deps used across crates
httpmock     = "0.7"
tokio-test   = "0.4"
pretty_assertions = "1"

[profile.release]
opt-level = 3
lto       = "thin"
