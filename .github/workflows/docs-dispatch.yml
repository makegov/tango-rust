name: Docs dispatch

# Fires on push to main when content that affects the published docs site
# changes (docs/, README, or CHANGELOG). Notifies makegov/docs via
# repository_dispatch so the docs site rebuilds without waiting for someone
# to push to the composer.
#
# tango-rust is a `coloc-source` repo: its docs/ folder is the authoritative
# source for the Rust SDK pages on docs.makegov.com.
#
# Required secrets:
#   DOCS_DISPATCH_TOKEN — GitHub token with contents:write on makegov/docs.
#
# Required variables (optional):
#   DOCS_TARGET_REPO — override the dispatch target (default: makegov/docs).

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Diffs the whole push (`before..sha`), not just its last commit.
      # A manual run, a new branch (all-zero `before`) or a force-push (`before` no longer in the history) dispatches unconditionally, reporting the last commit's paths.
      - name: Detect changed paths
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          paths=(docs README.md CHANGELOG.md)
          force=false
          if [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            force=true
            base=$(git rev-parse --verify -q HEAD~1 || git hash-object -t tree /dev/null)
          fi
          external=$(git diff --name-only "$base" HEAD -- "${paths[@]}" | paste -sd, -)
          has_external=false
          if [ "$force" = true ] || [ -n "$external" ]; then
            has_external=true
          fi
          {
            echo "external=$external"
            echo "has_external=$has_external"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch to docs composer (makegov/docs)
        if: steps.changes.outputs.has_external == 'true'
        env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
          TARGET: ${{ vars.DOCS_TARGET_REPO || 'makegov/docs' }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_REF: ${{ github.sha }}
          CHANGED_PATHS: ${{ steps.changes.outputs.external }}
        run: |
          gh api "repos/$TARGET/dispatches" \
            -f event_type=external_updated \
            -f "client_payload[source_repo]=$SOURCE_REPO" \
            -f "client_payload[source_ref]=$SOURCE_REF" \
            -f "client_payload[changed_paths]=$CHANGED_PATHS"
