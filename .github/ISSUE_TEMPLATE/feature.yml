name: Feature request
description: Suggest a new capability for tango-rust
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Who feels the pain?
    validations:
      required: true

  - type: textarea
    id: proposed-api
    attributes:
      label: Proposed API
      description: |
        What would the Rust-side surface look like? A sketch is fine.
      value: |
        ```rust
        client
            .list_grant_opportunities()
            .agency("DOE")
            .send()
            .await?;
        ```
      render: markdown
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches and why they don't fit.
    validations:
      required: false

  - type: textarea
    id: parity
    attributes:
      label: Parity with sibling SDKs
      description: Does tango-go / tango-node / tango-python already do this? Link the equivalent method.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
    validations:
      required: false
